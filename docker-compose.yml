volumes:
  service_postgres_data:

services:
  db:
    container_name: db
    image: postgres:18-alpine
    # Bind so localhost (host) — evita conflito com Postgres do host na 0.0.0.0:5432.
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5435}:5432"
    volumes:
      - service_postgres_data:/var/lib/postgresql
    env_file:
      - ./env-vars/.postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service:
    container_name: service
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "python3 manage.py migrate
      && python3 manage.py load_initial_data
      && python3 manage.py runserver 0.0.0.0:8080"
    ports:
      - "8080:8080"
    volumes:
      - ./src:/src:z
    env_file:
      - ./env-vars/.service.env
      - ./env-vars/.postgres.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # start_period cobre migrations + load_initial_data + collectstatic
      # que rodam antes do gunicorn subir (start_service.sh).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src
          target: /src
        - action: rebuild
          path: ./pyproject.toml
