name: Publish Docker Image

# Builda a imagem do Service no CI cloud (ubuntu-latest) e publica no
# DockerHub. A box de producao so faz PULL (deploy-prod.yml), nunca build.
# Publica em push pra main e em seguida aciona o deploy-prod.yml via workflow_call.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extrair SHA curto do commit
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login no DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest pra deploy simples + sha curto pra rollback/deploy deterministico.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service:sha-${{ steps.vars.outputs.short_sha }}

  trigger-deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
