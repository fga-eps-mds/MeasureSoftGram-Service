name: Publish Docker Image

# Builda a imagem do Service no CI cloud (ubuntu-latest) e publica no
# DockerHub somente apos a suite de testes (Rodar Testes) passar com sucesso.
# A box de producao so faz PULL (deploy-prod.yml), nunca build.
on:
  workflow_run:
    workflows: ["Rodar Testes"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest pra deploy simples + sha pra rollback/deploy deterministico.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service:${{ github.event.workflow_run.head_sha || github.sha }}
