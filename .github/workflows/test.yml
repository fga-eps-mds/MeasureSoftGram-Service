name: Rodar Testes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PORT: 5432
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0

      - name: Instalar dependências
        run: uv sync --frozen --no-install-project --no-build --all-extras

      - name: Rodar testes
        run: |
          uv run --locked --no-build coverage eraseerage erase
          uv run --locked --no-build coverage run -m pytest src -vv --junitxml=./junit.xml./junit.xml
          uv run --locked --no-build coverage xml -o coverage.xmloverage.xml
          uv run --locked --no-build coverage report --show-missinghow-missing

      - name: Rodar Migrations
        run: |
          uv run --locked --no-build python src/manage.py migrate.py migrate
          uv run --locked --no-build python src/manage.py makemigrations --check --dry-runk --dry-run

      - name: Envia cobertura para o Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac #v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: 2026.1-MeasureSoftGram-Service
          verbose: true
