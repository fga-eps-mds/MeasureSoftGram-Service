name: Rodar Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PORT: 5432
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Instalar dependências
        run: uv sync --frozen --no-install-project --all-extras

      - name: Rodar Linter (flake8)
        run: |
          uvx --no-build flake8==7.1.1 src/

      - name: Rodar Migrations
        env:
          # Chave pública e determinística usada somente no banco efêmero da CI.
          GITHUB_TOKEN_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          uv run --locked python src/manage.py makemigrations --check --dry-run
          uv run --locked python src/manage.py migrate

      - name: Rodar testes
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest src -vv --junitxml=./junit.xml
          uv run --locked coverage xml -o coverage.xml
          uv run --locked coverage report --show-missing

      # O SonarCloud só deve ser executado se:
      # 1. Não for disparado pelo Dependabot (que não possui acesso aos secrets de Actions)
      # 2. O evento for push (merge) OU um PR interno do próprio repositório (não fork externo)
      - name: Scanner do SonarCloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # 'sonar.qualitygate.wait=true' pausa a execução do step e consulta a API do SonarCloud
        # até a conclusão da análise. Se o Quality Gate for reprovado (cobertura insuficiente, bugs,
        # code smells), o scanner encerra com código de erro diferente de zero e quebra o CI na hora.
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true

      - name: Notificação de SonarCloud ignorado (Fork ou Dependabot)
        if: >-
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::notice title=SonarCloud Ignorado::O scan foi ignorado pois foi disparado pelo Dependabot ou originou-se de um fork externo sem acesso aos secrets de repositório."
