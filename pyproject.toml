[project]
name = "measuresoftgram-service"
version = "1.0.0"
description = "MeasureSoftGram Service — Backend API"
requires-python = ">=3.12"

dependencies = [
  "cryptography==50.0.1",
  "asgiref==3.8.1",
  "dj-database-url==3.1.2",
  "Django==5.2.17",
  "django-apscheduler==0.7.0",
  "djangorestframework==3.18.0",
  "drf_yasg==1.21.15",
  "gunicorn==20.1.0",
  "psycopg2-binary==2.9.11",
  "pytz==2022.1",
  "sqlparse==0.4.4",
  "whitenoise==6.12.0",
  "django-simple-history==3.13.0",
  "drf-nested-routers==0.95.3",
  "django-cors-headers==4.9.0",
  "requests==2.31.0",
  "django-allauth[socialaccount]==65.19.2",
  "dj-rest-auth==7.2.0",
  "msgram-core==1.5.4",
  "django-extensions==4.1",
  "setuptools>=75.0.0,<78",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-mock",
  "parameterized~=0.8.1",
  "tox==3.27.1",
  "freezegun==1.5.1",
  "coverage",
  "pre-commit>=3.7.0",
  "django-debug-toolbar==8.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_glob = ["**/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
minversion = "6.0"
addopts = "-ra -q"

